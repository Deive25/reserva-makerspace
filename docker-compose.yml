# Sobe o PostgreSQL e a API. Precisa de um .env (copie o .env.example e defina a senha).
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makerspace}
      POSTGRES_USER: ${POSTGRES_USER:-makerspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5433:5432" # 5433 no host, para não colidir com outro PostgreSQL na 5432
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5080:8080"
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # A senha vai à parte, pela variável PGPASSWORD que o Npgsql lê, para não aparecer em texto no arquivo.
      ConnectionStrings__Makerspace: Host=banco;Database=${POSTGRES_DB:-makerspace};Username=${POSTGRES_USER:-makerspace}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

volumes:
  dados-banco:
